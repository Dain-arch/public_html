<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gDaily" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="60%" stop-color="#FCECE7"/>
      <stop offset="100%" stop-color="#FAD4DF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#gDaily)"/>
  <!-- Campus Bench & Trees Motif -->
  <circle cx="450" cy="180" r="100" fill="#FFE5D9" opacity="0.5"/>
  <g transform="translate(300, 330)">
    <!-- Tree branch -->
    <path d="M 120, -150 Q 70, -80 100, 50" fill="none" stroke="#D9849A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="-120" r="35" fill="#FAD4DF" opacity="0.7"/>
    <circle cx="120" cy="-80" r="45" fill="#F2A8BC" opacity="0.6"/>
    <!-- Bench -->
    <path d="M -120, 20 L 60, 20 M -120, 35 L 60, 35" stroke="#703648" stroke-width="4" stroke-linecap="round"/>
    <path d="M -100, 20 L -100, 80 M 40, 20 L 40, 80" stroke="#703648" stroke-width="4" stroke-linecap="round"/>
    <!-- Book & Coffee Cup on Bench -->
    <rect x="-60" y="-5" width="30" height="25" rx="3" fill="#FFFFFF" stroke="#D9849A" stroke-width="2"/>
    <path d="M -10, 0 L 5, 0 L 3, 20 L -8, 20 Z" fill="#FAD4DF" stroke="#D9849A" stroke-width="1.5"/>
  </g>
  <text x="300" y="520" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#703648">캠퍼스의 햇살과 일상</text>
  <text x="300" y="550" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="12" fill="#8C817D">[예시 사진 / Daily Life]</text>
</svg>
